version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: b2b_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: b2b_admin
      POSTGRES_PASSWORD: secret_password123
      POSTGRES_DB: b2b_platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: b2b_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7-alpine
    container_name: b2b_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
    name: b2b_db_data
  pgadmin_data:                      
    name: b2b_pgadmin_data     