version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: b2b_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: b2b_admin
      POSTGRES_PASSWORD: secret_password123
      POSTGRES_DB: b2b_platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: b2b_db_data
